<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{TITLE}} · {{APP_NAME}}</title>
  <link rel="canonical" href="{{CANONICAL}}">
  <meta name="theme-color" content="#FFF6EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#120D18" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">{{{LOGO}}}<span class="brand-name">{{APP_NAME}}</span></a>
  </header>
  <main class="doc-main">
    <a class="doc-back" href="/">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#i-chevron-left"/></svg>{{t:btn.home}}
    </a>
    <article class="doc">
      {{{CONTENT}}}
    </article>
  </main>
  <footer class="site-footer">
    <p>© {{YEAR}} {{APP_NAME}}</p>
    <nav class="footer-links">
      <a href="/terms">{{t:link.terms}}</a>
      <a href="/privacy">{{t:link.privacy}}</a>
      <a href="/guidelines">{{t:link.guidelines}}</a>
    </nav>
  </footer>
</body>
</html>
